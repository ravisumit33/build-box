<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Small interactive apps powered by C++ and WebAssembly." />
    <title>Build Box</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f3f4f6;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 960px; margin: 0 auto; padding: 64px 24px; }
      h1 { font-size: clamp(2.5rem, 7vw, 4rem); margin: 0 0 16px; }
      .intro { color: #cbd5e1; line-height: 1.7; max-width: 600px; }
      .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; margin-top: 40px; }
      .app { color: inherit; text-decoration: none; background: #1f2937; border: 1px solid #374151; border-radius: 16px; padding: 24px; }
      .app:hover { border-color: #93c5fd; }
      .app:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
      .app h2 { margin: 0 0 12px; }
      .app p { color: #cbd5e1; line-height: 1.6; }
      .app span { color: #93c5fd; }
      footer { margin-top: 48px; color: #94a3b8; font-size: 0.9rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Build Box</h1>
      <p class="intro">A collection of small, interactive things I've built. Choose an app and use it directly in your browser.</p>
      <nav class="apps" aria-label="Apps">
        {{APP_CARDS}}
      </nav>
      <footer>Built with C++ engines compiled to WebAssembly and TypeScript frontends. Everything runs in your browser.</footer>
    </main>
  </body>
</html>
